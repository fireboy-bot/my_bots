<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1e1b4b" />
    <meta name="description" content="🎮 Числяндия — образовательная математическая игра для детей" />
    <title>🎮 Числяндия</title>
    
    <!-- 🔹 Шрифты -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- 🔹 Глобальные стили -->
    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }
      
      html, body {
        margin: 0 !important;
        padding: 0 !important;
        overflow-x: hidden !important;
        background: linear-gradient(135deg, #1e1b4b, #312e81, #4c1d95) !important;
        font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif;
        color: #E2E8F0;
        min-height: 100vh;
        width: 100%;
        height: 100%;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      #root {
        position: relative !important;
        background: transparent !important;
        min-height: 100vh;
      }
      
      /* 🔹 Скрытие скроллбара для игрового ощущения */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.05);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255,255,255,0.2);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255,255,255,0.3);
      }
      
      /* 🔹 Анимация появления */
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      
      .fade-in {
        animation: fadeIn 0.3s ease-out forwards;
      }
    </style>
  </head>
  <body>
    <!-- 🔹 React App Root -->
    <div id="root"></div>
    
    <!-- 🔹 Точка входа -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
