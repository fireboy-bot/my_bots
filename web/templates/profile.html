<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль - Числяндия</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            font-family: 'Comic Sans MS', 'Nunito', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }
        h1 {
            color: #667eea;
            text-align: center;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }
        .stat-value {
            font-size: 32px;
            font-weight: bold;
            margin: 10px 0;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 12px 32px;
            border-radius: 50px;
            text-decoration: none;
            margin: 10px;
        }
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #667eea;
            display: block;
            margin: 0 auto 20px;
        }
        .profile-header {
            text-align: center;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile-header">
            <!-- Аватарка (заглушка) -->
            <img src="{{ url_for('static', filename='img/avatar.png') }}" 
                 alt="Аватар" 
                 class="avatar"
                 onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%23667eea%22/><text x=%2250%22 y=%2260%22 text-anchor=%22middle%22 fill=%22white%22 font-size=%2240%22>🥕</text></svg>'">
            
            <h1>👤 Профиль игрока</h1>
            <p>ID: {{ user_id }}</p>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div>🏆 Уровень</div>
                <div class="stat-value">{{ user.get('level', 1) }}</div>
            </div>
            <div class="stat-card">
                <div>💰 Очки</div>
                <div class="stat-value">{{ user.get('total_score', 0) }}</div>
            </div>
            <div class="stat-card">
                <div>🎒 Баланс</div>
                <div class="stat-value">{{ user.get('score_balance', 0) }}</div>
            </div>
            <div class="stat-card">
                <div>✅ Задач решено</div>
                <div class="stat-value">{{ user.get('tasks_solved', 0) }}</div>
            </div>
        </div>
        
        <div style="text-align: center; margin-top: 30px;">
            <a href="/" class="btn">← На главную</a>
        </div>
    </div>
</body>
</html>
